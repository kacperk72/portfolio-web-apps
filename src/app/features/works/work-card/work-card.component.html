<a
  class="card"
  [class.card--tall]="cardSpan() === 'tall'"
  [class.card--wide]="cardSpan() === 'wide'"
  [href]="item().href"
  [attr.target]="target()"
  [attr.rel]="rel()"
>
  <div class="card__cover">
    <img
      [src]="item().coverSrc"
      [attr.alt]="item().coverAltKey ? (item().coverAltKey | translate) : ''"
      loading="lazy"
    />
  </div>

  <div class="card__info">
    <div class="card__head">
      <span class="card__name">{{ item().titleKey | translate }}</span>
      <svg
        class="card__arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M7 17L17 7" />
        <path d="M7 7h10v10" />
      </svg>
    </div>
    <p class="card__desc">{{ item().descriptionKey | translate }}</p>
  </div>
</a>
